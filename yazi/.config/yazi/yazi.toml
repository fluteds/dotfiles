[manager]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
image_protocol = "kitty"
max_width  = 600
max_height = 900
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', block = true },
]
open = [
  { run = 'open "$@"' },
]
play = [
  { run = 'mpv "$@"', orphan = true },
]
reveal = [
  { run = 'open -R "$@"' },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { mime = "image/*", use = "open" },
  { mime = "application/pdf", use = "open" },
]
