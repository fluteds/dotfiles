# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse
set -g mouse on

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vi mode
set -g mode-keys vi
set -g status-keys vi

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Splits (open in current dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Keybinds cheatsheet
bind / split-window -h -l 56 "cat ~/.tmux_keybinds; read -r"

# No delay for escape
set -sg escape-time 0

# Longer history
set -g history-limit 50000

# ===========
# Status bar
# ===========

set -g status-position bottom
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left-length 40
set -g status-right-length 80

# Rose Pine colors
set -g status-left "#[bg=#31748f,fg=#191724,bold] #S #[bg=#191724,fg=#31748f] "
set -g status-right "#[fg=#6e6a86] %H:%M  %d %b #[fg=#9ccfd8] #(whoami)@#H "

set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#403d52,fg=#e0def4,bold] #I #W "
set -g window-status-style "fg=#6e6a86"
set -g window-status-current-style "fg=#e0def4"

set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#31748f"

set -g message-style "bg=#31748f,fg=#191724"
